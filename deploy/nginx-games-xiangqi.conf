# 挂到 www.yydsxwh.com 的 server 里。静态目录按服务器实际路径调整。
# 鉴权打到主站 Node 的 /api/games/xiangqi/access，并带上用户 Cookie。

location = /_xiangqi_access {
    internal;
    proxy_pass http://127.0.0.1:3000/api/games/xiangqi/access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
}

location ^~ /games/xiangqi/ {
    auth_request /_xiangqi_access;
    error_page 401 = @xiangqi_denied;
    error_page 403 = @xiangqi_denied;
    alias /var/www/xiangqi-web/;
    try_files $uri $uri/ /games/xiangqi/index.html;
}

location @xiangqi_denied {
    default_type text/html;
    return 403 '<!doctype html><meta charset="utf-8"><title>站长内测</title><p>中国象棋正在站长内测，当前账号不能进入。</p><p><a href="/games">返回游戏中心</a></p>';
}
