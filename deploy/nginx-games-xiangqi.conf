# 已安装到服务器 /etc/nginx/snippets/xiangqi-beta.conf
# 由 /etc/nginx/sites-available/yyds-course 在 location / 之前 include。

location = /games/xiangqi {
    return 301 /games/xiangqi/;
}

# 象棋后台走主站 Node，不进静态目录。页面自己校验站长。
location = /games/xiangqi/admin {
    proxy_pass http://127.0.0.1:3000/games/xiangqi/admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie $http_cookie;
}

location = /games/xiangqi/admin/ {
    return 301 /games/xiangqi/admin;
}

# 联网房间走独立进程。页面和接口都再校验站长内测。
location ^~ /api/games/xiangqi/rooms {
    proxy_pass http://127.0.0.1:3010/rooms;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Real-IP $remote_addr;
}

location = /games/xiangqi/ws {
    proxy_pass http://127.0.0.1:3010/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header Cookie $http_cookie;
    proxy_read_timeout 3600s;
}

location = /_xiangqi_access {
    internal;
    proxy_pass http://127.0.0.1:3000/api/games/xiangqi/access;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /games/xiangqi/ {
    auth_request /_xiangqi_access;
    error_page 401 403 = @xiangqi_denied;
    alias /var/www/xiangqi-web/;
    index index.html;
    add_header Cache-Control "no-cache";
}

location @xiangqi_denied {
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store";
    return 403 "<!doctype html><meta charset=utf-8><title>站长内测</title><p>中国象棋正在站长内测，当前账号不能进入。</p><p><a href=/games>返回游戏中心</a></p>";
}
